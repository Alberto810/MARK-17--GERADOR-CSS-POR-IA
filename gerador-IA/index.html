<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador CSS por IA</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="IA-logo.jpg" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code&display=swap" rel="stylesheet">
</head>

<body>

    <h1>
        Gerador CSS <span>com IA</span>⚡️
    </h1>

    <p>
        Descreva o que você imagina e veja a mágica acontecer
    </p>

    <!-- area de texto -->
    <!-- rows - linhas -->
    <textarea rows="3" class="caixa-texto" placeholder="Ex: Bola azul pingando"></textarea>

    <button class="botao-gerar">Gerar Código ⚡️</button>

    <!-- div = caixa invisível -->
    <div class="resultado">

        <div>
            <h2>Código</h2>
            <p class="bloco-codigo language-html"></p>
        </div>

        <div>
            <h2>Preview</h2>
            <iframe class="resultado-codigo"></iframe>
        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
