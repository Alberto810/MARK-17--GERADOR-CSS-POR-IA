<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador CSS por IA</title>
    <link rel="stylesheet" href="/gerador-IA/public/style.css">
    <link rel="icon" href="/gerador-IA/public/favicon.ico" type="image/x-icon">
</head>

<body>

    <h1>
        Gerador CSS <span>com IA</span>

    <p>

    <div class="lua"></div>
